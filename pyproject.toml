[project]
name = "aioclaw"
version = "0.1.0"

dependencies = [
	"orjson>=3.11.9",
	"pydantic>=2.13.4",
	"aiofiles>=25.1.0",
	"trafilatura==2.0.0",
	"fake-useragent==2.2.0",
	"asyncstdlib==3.14.0",
	"aioverse",
	"python-frontmatter"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aioclaw"]